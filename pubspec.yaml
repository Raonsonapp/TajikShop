name: aurix_editor
description: AURIX — Professional mobile video editor.
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/aurix_logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/aurix_logo.jpg
  min_sdk_android: 24
  remove_alpha_ios: true
