name: tajikshop
description: TajikShop Marketplace App - Бозори Тоҷикистон
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Харита (OpenStreetMap — ройгон, бе калид)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # UI-и мисли template-и ecommerce
  flutter_svg: ^2.0.10+1
  flutter_staggered_grid_view: ^0.7.0
  card_swiper: ^3.0.1
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/product.png
    - assets/banner.jpg
    - assets/user.png
    - assets/tmpl/
    - assets/tmpl/icons/
    - assets/tmpl/promotional/
