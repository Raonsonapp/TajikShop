name: Integration Test (real app on emulator)

# Тести ВОҚЕӢ: барнома дар эмулятори Android оғоз мешавад, ба backend-и
# ҳақиқӣ пайваст мешавад, ҳисоб месозад ва экранҳоро мегардад.
#
# Чаро ин лозим аст: қариб ҳамаи хатоҳои ҷиддии ин барнома — росткунҷаҳои
# хокистарранг, тугмаҳои кор накарда, «invalid token» — `flutter analyze`-ро
# бе садо мегузаштанд ва танҳо дар телефон намоён мешуданд.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Эмулятор гарон аст — run-и кӯҳнаро бекор мекунем.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Space-и Hugging Face дар бекорӣ мехобад. Агар онро бедор накунем,
      # аввалин дархости тест ба timeout мерасад ва тест бардурӯғ меафтад.
      - name: Wake the backend
        continue-on-error: true
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
              --max-time 30 https://mahmadmurodov-tajikshop.hf.space/health || echo 000)
            echo "urinish $i → HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; echo; break; fi
            sleep 15
          done

      # Бе KVM эмулятор дар runner кор намекунад.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/app_test.dart --timeout none

      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure
          path: |
            build/
          retention-days: 5
          if-no-files-found: ignore
