name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push clean backend to Hugging Face
        run: |
          git config --global user.email "ehsonmahmadmurodov@gmail.com"
          git config --global user.name "Mahmadmurodov"
          
          mkdir ../hf_space
          
          # Нусхабардории лоиҳаи Go
          find . -maxdepth 3 -name "go.mod" -exec dirname {} \; | while read dir; do
            cp -r $dir/* ../hf_space/ 2>/dev/null || true
          done
          
          # Ҳатман нусхабардории README.md ва Dockerfile аз папкаи асосӣ
          cp README.md ../hf_space/ 2>/dev/null || true
          cp Dockerfile ../hf_space/ 2>/dev/null || true
          
          cd ../hf_space
          rm -rf android ios macos windows linux .github
          
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy clean backend with metadata"
          
          git remote add hf https://Mahmadmurodov:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Mahmadmurodov/TailkShop
          git push --force hf main
