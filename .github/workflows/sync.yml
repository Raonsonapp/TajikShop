name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # агар номи веткаи асосиат master бошад, master навис

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        run: |
          git remote add hf https://huggingface.co/spaces/Mahmadmurodov/TajikShop
          git push --force https://Mahmadmurodov:${{ secrets.GH_TOKEN }}@huggingface.co/spaces/Mahmadmurodov/TajikShop main
