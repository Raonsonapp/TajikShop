name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # агар веткаат master бошад, master навис

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HF_SSH_KEY }}
          known_hosts: ${{ secrets.HF_KNOWN_HOSTS }}

      - name: Push to Hugging Face
        run: |
          git remote add hf git@huggingface.co:spaces/Mahmadmurodov/TajikShop.git
          git push --force hf main
