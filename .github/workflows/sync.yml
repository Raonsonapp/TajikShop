name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Remove binary folders for HF
        run: |
          rm -rf android
          rm -rf macos
          rm -rf ios
          rm -rf windows
          rm -rf linux

      - name: Push to Hugging Face
        run: |
          git config --global user.email "ehsonmahmadmurodov@gmail.com"
          git config --global user.name "Mahmadmurodov"
          git add .
          git commit -m "Clean binaries for HF" || echo "No changes"
          git remote add hf https://Mahmadmurodov:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Mahmadmurodov/TajikShop
          git push --force hf main
