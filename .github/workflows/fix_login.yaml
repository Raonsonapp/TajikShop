name: Fix Login Screen

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write fixed files
        run: |
          echo "" | base64 -d > lib/core/constants/app_strings.dart
          echo "" | base64 -d > lib/modules/auth/login_screen.dart

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/core/constants/app_strings.dart lib/modules/auth/login_screen.dart
          git commit -m "fix: HuggingFace URL + remove LayoutBuilder blank screen bug"
          git push
