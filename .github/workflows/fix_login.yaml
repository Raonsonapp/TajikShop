name: "Fix Login Screen"

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix app_strings.dart (URL)
        run: |
          cat > lib/core/constants/app_strings.dart << 'DART'
