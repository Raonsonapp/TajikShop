name: Almaz TJ Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build release APK
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          DEFINE=""
          if [ -n "$R2_PUBLIC_BASE_URL" ]; then DEFINE="--dart-define=ALMAZ_ASSETS_BASE_URL=$R2_PUBLIC_BASE_URL/almaz"; fi
          flutter build apk --release $DEFINE
      - name: Build release AAB
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          DEFINE=""
          if [ -n "$R2_PUBLIC_BASE_URL" ]; then DEFINE="--dart-define=ALMAZ_ASSETS_BASE_URL=$R2_PUBLIC_BASE_URL/almaz"; fi
          flutter build appbundle --release $DEFINE
      - name: Verify AAB
        run: test -s build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Almaz-TJ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Almaz-TJ-AAB
          path: build/app/outputs/bundle/release/app-release.aab
